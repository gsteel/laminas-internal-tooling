name: 'Continuous Integration'
'on':
  pull_request: 
  push:
    branches: 
    tags:

jobs:
  matrix:
    name: 'Generate job matrix'
    runs-on: ubuntu-latest
    outputs:
      matrix: '${{ steps.matrix.outputs.matrix }}'
    steps:
      - name: 'Gather CI configuration'
        id: matrix
        uses: laminas/laminas-ci-matrix-action@1.36.0
  qa:
    name: 'QA Checks'
    needs:
      - matrix
    runs-on: '${{ matrix.operatingSystem }}'
    strategy:
      fail-fast: false
      matrix: '${{ fromJSON(needs.matrix.outputs.matrix) }}'
    steps:
      - name: '${{ matrix.name }}'
        uses: laminas/laminas-continuous-integration-action@1.48.0
        with:
          job: '${{ matrix.job }}'
